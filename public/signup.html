<!DOCTYPE html>
<html>
<head>
    <title>Signup - StudyHub Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">

    <h1>Create Account</h1>

    <form>

        <input
        type="text"
        placeholder="Full Name"
        required>

        <input
        type="email"
        placeholder="Email"
        required>

        <input
        type="password"
        placeholder="Password"
        required>

        <button type="submit">
            Signup
        </button>

    </form>

</div>

</body>
</html>
