<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | EduVault</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="glass-panel" style="padding:40px; width:100%; max-width:420px;">
        <h2 style="text-align:center; margin-bottom:8px;"><i class="fa-solid fa-vault" style="color:var(--primary);"></i> EduVault Login</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:28px;">Enter credentials to access tests & dashboard</p>

        <form id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
            <input type="email" id="loginEmail" placeholder="student@gmail.com" required class="btn btn-outline" style="text-align:left;">
            <input type="password" id="loginPassword" placeholder="••••••••" required class="btn btn-outline" style="text-align:left;">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:0.9rem;">Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:700;">Sign up free</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;

          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem("eduvault_token", data.token);
            localStorage.setItem("eduvault_user", JSON.stringify(data.user));
            alert("Login successful!");
            window.location.href = "index.html";
          } else {
            alert(data.message || "Login failed.");
          }
        });
    </script>
</body>
</html>
