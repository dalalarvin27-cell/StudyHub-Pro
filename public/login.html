<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | StudyHub Pro</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<!-- Script Integration -->
    <script src="script.js"></script>
</body>
</html>
<body class="auth-page">

    <div class="auth-container">
        <!-- Left Banner -->
        <div class="auth-banner">
            <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            <div class="banner-content">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h2>Welcome Back! 🚀</h2>
                <p>Log in to access all your saved notes, premium PYQs, and study materials in one place.</p>
            </div>
        </div>

        <!-- Right Form -->
        <div class="auth-form-box">
            <div class="form-header">
                <h2>Sign In</h2>
                <p>New to StudyHub Pro? <a href="signup.html">Create an account</a></p>
            </div>

            <form class="auth-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Login Successful!');">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-pass">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In</button>

                <div class="divider"><span>OR CONTINUE WITH</span></div>

                <div class="social-auth">
                    <button type="button" class="btn btn-social"><i class="fa-brands fa-google"></i> Google</button>
                    <button type="button" class="btn btn-social"><i class="fa-brands fa-github"></i> GitHub</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
