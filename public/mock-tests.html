<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVault - Mock Test Runner</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    
    <!-- Sticky Timer Header -->
    <div class="sticky top-0 z-20 bg-white/95 backdrop-blur p-4 rounded-xl shadow-md border mb-6 flex justify-between items-center">
      <div>
        <h1 id="testFileName" class="text-lg sm:text-xl font-bold">Mock Test Series</h1>
        <p id="testMetaData" class="text-xs sm:text-sm text-gray-500 capitalize">Loading session...</p>
      </div>

      <div className="flex items-center space-x-2">
        <span class="text-xs text-gray-400 font-medium hidden sm:inline">Time Remaining:</span>
        <div id="timerDisplay" class="px-4 py-2 bg-blue-100 text-blue-800 font-mono text-xl font-bold rounded-lg border border-blue-200">
          10:00
        </div>
      </div>
    </div>

    <!-- Result Banner -->
    <div id="resultBanner" class="hidden"></div>

    <!-- Questions Container -->
    <div id="questionsContainer" class="space-y-6">
      <div class="p-8 text-center bg-white rounded-xl shadow">
        <p class="text-gray-500">Loading test questions...</p>
      </div>
    </div>

    <!-- Submit Footer -->
    <div class="mt-8 pt-4 border-t flex justify-end">
      <button id="manualSubmitBtn" onclick="window.manualSubmitMockTest()" class="w-full sm:w-auto px-8 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition text-lg">
        Submit Test
      </button>
    </div>
  </div>

  <script src="/js/mockTestEngine.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const testId = urlParams.get("id");

      let quizData = null;
      const cached = localStorage.getItem("currentQuiz");
      
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (!testId || parsed.testId === testId || parsed._id === testId) {
            quizData = parsed;
          }
        } catch(e){}
      }

      // Fetch from API if not found locally
      if (!quizData && testId) {
        try {
          const res = await fetch(`/api/mock-tests/${testId}`);
          const data = await res.json();
          if (data && data.success) {
            quizData = data.data;
          }
        } catch(e){}
      }

      if (!quizData) {
        document.getElementById("questionsContainer").innerHTML = `
          <div class="p-8 text-center bg-white rounded-xl shadow text-red-600 font-bold">
            Mock test not found or failed to load. <a href="/scan.html" class="underline text-blue-600">Generate a new test</a>
          </div>
        `;
        return;
      }

      // Populate Header Details
      document.getElementById("testFileName").innerText = quizData.sourceFile || "Mock Test Series";
      document.getElementById("testMetaData").innerText = `Difficulty: ${quizData.difficulty || 'medium'} | Total Questions: ${quizData.questions?.length || 0}`;

      // Initialize Timer
      window.initTestTimer(quizData.duration || 10);

      // Render Questions
      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      quizData.questions.forEach((q, idx) => {
        const qKey = q.questionId || idx;
        const qCard = document.createElement("div");
        qCard.className = "p-5 bg-white rounded-xl shadow-sm border border-gray-200";

        let optionsHtml = "";
        q.options.forEach((opt, optIdx) => {
          optionsHtml += `
            <label class="flex items-center p-3 rounded-lg border cursor-pointer hover:bg-blue-50/50 transition">
              <input type="radio" name="q_${qKey}" value="${optIdx}" class="mr-3 text-blue-600 w-4 h-4">
              <span>${opt}</span>
            </label>
          `;
        });

        qCard.innerHTML = `
          <h3 class="font-bold text-base sm:text-lg mb-4 text-gray-800">${idx + 1}. ${q.questionText}</h3>
          <div class="space-y-2">${optionsHtml}</div>
        `;

        container.appendChild(qCard);
      });
    });
  </script>
</body>
</html>
