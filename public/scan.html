<!-- public/scan.html -->

<!-- Include Mock Test Engine script before closed body tag -->
<script src="/js/mockTestEngine.js"></script>
<script src="/js/app.js"></script>

<script>
  // Button Click Listener Example in scan.html
  document.getElementById("generateTestBtn")?.addEventListener("click", async function(e) {
    e.preventDefault();

    const fileInput = document.getElementById("fileInput");
    const difficultySelect = document.getElementById("difficultySelect");
    const durationRadio = document.querySelector('input[name="duration"]:checked');

    if (!fileInput || !fileInput.files[0]) {
      alert("Please upload a PDF or image file first.");
      return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("difficulty", difficultySelect ? difficultySelect.value : "medium");
    formData.append("duration", durationRadio ? durationRadio.value : "10");

    // Call globally defined generator function
    if (typeof window.generateAndLaunchCustomTest === "function") {
      await window.generateAndLaunchCustomTest(formData);
    } else if (typeof window.startTest === "function") {
      window.startTest();
    } else {
      alert("Test Generator script is loading. Please wait a second and try again.");
    }
  });
</script>
</body>
</html>
