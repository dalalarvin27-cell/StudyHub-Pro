<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVault - Custom Test Series Generator Studio</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <header class="mb-6 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl sm:text-2xl font-bold text-blue-800">Custom Test Series Studio 📸📄</h1>
      <a href="/dashboard.html" class="text-blue-600 font-semibold hover:underline">← Dashboard</a>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-lg font-bold mb-2">Scan Photos or Upload PDF Notes</h2>
      <p class="text-gray-600 mb-6 text-sm">
        Capture handwritten pages using phone camera or upload PDF files to generate a custom timed Test Series.
      </p>

      <!-- Upload Input -->
      <div class="border-2 border-dashed border-blue-200 p-8 rounded-lg text-center bg-blue-50/50 mb-6">
        <input type="file" id="scanFileInput" accept=".pdf,image/*" capture="environment" class="hidden" />
        <label for="scanFileInput" class="cursor-pointer bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition inline-block shadow">
          Open Phone Camera / Select PDF
        </label>
        <p id="fileStatusText" class="mt-3 text-sm text-gray-500 font-medium">Max Allowed File Size: 4.5 MB</p>
      </div>

      <!-- Test Configuration Options -->
      <div class="space-y-5 border-t pt-5">
        <div>
          <label class="block font-bold text-sm text-gray-700 mb-1">🎯 Difficulty Level</label>
          <select id="scanDifficulty" class="w-full border p-2.5 rounded-lg bg-white">
            <option value="easy">Easy (Basic Definitions)</option>
            <option value="medium" selected>Medium (Conceptual Understanding)</option>
            <option value="hard">Hard (Advanced Tricky)</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-sm text-gray-700 mb-1">⏱️ Countdown Timer Duration</label>
          <div class="flex space-x-6 mt-2">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="radio" name="scanTimer" value="5">
              <span class="font-medium">5 Minutes</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="radio" name="scanTimer" value="10" checked>
              <span class="font-medium">10 Minutes</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="radio" name="scanTimer" value="15">
              <span class="font-medium">15 Minutes</span>
            </label>
          </div>
        </div>

        <button id="generateCustomTestBtn" class="w-full py-3.5 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 shadow-md transition text-lg mt-6">
          Generate & Launch Custom Test Series Now 🚀
        </button>
      </div>
    </div>
  </div>

  <script src="/js/mockTestEngine.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const fileInput = document.getElementById("scanFileInput");
      const fileStatus = document.getElementById("fileStatusText");
      const generateBtn = document.getElementById("generateCustomTestBtn");

      fileInput?.addEventListener("change", function(e) {
        if (e.target.files && e.target.files[0]) {
          const f = e.target.files[0];
          fileStatus.innerText = `Selected: ${f.name} (${(f.size / 1024).toFixed(2)} KB) — Ready for OCR`;
          fileStatus.className = "mt-3 text-sm text-green-700 font-bold";
        }
      });

      generateBtn?.addEventListener("click", async function() {
        if (!fileInput || !fileInput.files[0]) {
          alert("Please select a PDF or photo file first.");
          return;
        }

        const difficulty = document.getElementById("scanDifficulty").value;
        const durationRadio = document.querySelector('input[name="scanTimer"]:checked');
        const duration = durationRadio ? durationRadio.value : "10";

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("difficulty", difficulty);
        formData.append("duration", duration);

        generateBtn.disabled = true;
        generateBtn.innerText = "Generating Fresh Test Series...";

        if (typeof window.generateAndLaunchCustomTest === "function") {
          await window.generateAndLaunchCustomTest(formData);
        } else {
          alert("Engine script loading. Please try again.");
        }

        generateBtn.disabled = false;
        generateBtn.innerText = "Generate & Launch Custom Test Series Now 🚀";
      });
    });
  </script>
</body>
</html>
