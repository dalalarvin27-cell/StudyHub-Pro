<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EduVault</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-user-shield"></i> EduVault Admin Control</a>
            <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-globe"></i> Public Portal</a>
        </nav>
    </header>

    <main style="max-width:1200px; margin:40px auto; padding:0 24px;">
        <div style="display:grid; grid-template-columns:1fr 1.5fr; gap:30px; align-items:start;">
            
            <!-- CREATE MOCK TEST FORM -->
            <div class="glass-panel" style="padding:28px;">
                <h3><i class="fa-solid fa-plus-circle"></i> Create New Mock Test</h3>
                <form id="adminCreateTestForm" style="display:flex; flex-direction:column; gap:16px; margin-top:20px;">
                    <input type="text" id="testTitle" placeholder="Test Title (e.g. NDA GAT Mock Test 2026)" required class="btn btn-outline" style="text-align:left;">
                    
                    <select id="testCategory" class="btn btn-outline" style="text-align:left;">
                        <option value="NDA">NDA</option>
                        <option value="JEE">JEE</option>
                        <option value="NEET">NEET</option>
                        <option value="UPSC">UPSC</option>
                        <option value="SSC">SSC</option>
                    </select>

                    <input type="number" id="testDuration" placeholder="Duration (Minutes)" value="30" required class="btn btn-outline" style="text-align:left;">
                    <input type="number" id="testMarks" placeholder="Total Marks" value="100" required class="btn btn-outline" style="text-align:left;">
                    
                    <textarea id="testDescription" rows="3" placeholder="Description & Instructions" class="btn btn-outline" style="text-align:left;"></textarea>

                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Create Test Live</button>
                </form>
            </div>

            <!-- ANALYTICS STATS OVERVIEW -->
            <div style="display:flex; flex-direction:column; gap:24px;">
                <div class="glass-card">
                    <h3>Platform Overview Statistics</h3>
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:16px; text-align:center;">
                        <div style="background:var(--primary-light); padding:16px; border-radius:10px;">
                            <h4 id="statUsers">--</h4>
                            <small>Students</small>
                        </div>
                        <div style="background:var(--primary-light); padding:16px; border-radius:10px;">
                            <h4 id="statTests">--</h4>
                            <small>Mock Tests</small>
                        </div>
                        <div style="background:var(--primary-light); padding:16px; border-radius:10px;">
                            <h4 id="statAttempts">--</h4>
                            <small>Attempts</small>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        async function loadAdminAnalytics() {
          const token = localStorage.getItem("eduvault_token");
          if (!token) return;

          try {
            const res = await fetch("/api/admin/analytics", {
              headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.stats) {
              document.getElementById("statUsers").innerText = data.stats.totalUsers;
              document.getElementById("statTests").innerText = data.stats.totalMockTests;
              document.getElementById("statAttempts").innerText = data.stats.totalAttempts;
            }
          } catch(e) {}
        }
        document.addEventListener("DOMContentLoaded", loadAdminAnalytics);
    </script>
</body>
</html>
